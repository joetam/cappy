name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install swift-format when the runner does not bundle it
        run: |
          if ! command -v swift-format >/dev/null 2>&1 && ! xcrun --find swift-format >/dev/null 2>&1; then
            brew install swift-format
          fi
      - name: Lint and test
        run: make lint && make test
      - name: Build Apple-silicon archive
        env:
          CAPPY_RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cappy ${GITHUB_REF_NAME#v}" \
            --notes "Apple-silicon preview for macOS 14 or newer. Unzip Cappy, move it to Applications, then control-click and choose Open the first time. This preview is ad-hoc signed while Developer ID notarization is being set up."
