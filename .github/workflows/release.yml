name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - name: Verify release tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
             && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "::error::The dispatched workflow ref must match release tag $RELEASE_TAG."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ \
             || "$(git tag --points-at HEAD --list "$RELEASE_TAG")" != "$RELEASE_TAG" ]]; then
            echo "::error::Release must use an existing semantic tag at the checked-out commit."
            exit 1
          fi
      - name: Install swift-format when the runner does not bundle it
        run: |
          if ! command -v swift-format >/dev/null 2>&1 && ! xcrun --find swift-format >/dev/null 2>&1; then
            brew install swift-format
          fi
      - name: Lint and test
        run: make lint && make test

      - name: Verify release credentials
        env:
          SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$SIGNING_CERTIFICATE" \
             || -z "$SIGNING_CERTIFICATE_PASSWORD" \
             || -z "$NOTARY_PRIVATE_KEY" \
             || -z "$NOTARY_KEY_ID" \
             || -z "$NOTARY_ISSUER_ID" \
             || -z "$SPARKLE_PRIVATE_KEY" \
             || -z "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            echo "::error::The release environment is missing one or more release credentials."
            exit 1
          fi

      - name: Import release credentials
        env:
          SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          CERTIFICATE_FILE="$RUNNER_TEMP/cappy-release-signing.p12"
          KEYCHAIN_FILE="$RUNNER_TEMP/cappy-release-signing.keychain-db"
          NOTARY_KEY_FILE="$RUNNER_TEMP/cappy-release-notary.p8"
          ORIGINAL_KEYCHAINS_FILE="$RUNNER_TEMP/cappy-original-keychains.txt"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$CERTIFICATE_FILE"
          printf '%s' "$NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_FILE"
          chmod 600 "$CERTIFICATE_FILE" "$NOTARY_KEY_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERTIFICATE_FILE" \
            -k "$KEYCHAIN_FILE" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_FILE" >/dev/null

          security list-keychains -d user > "$ORIGINAL_KEYCHAINS_FILE"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            ORIGINAL_KEYCHAINS+=("$keychain")
          done < "$ORIGINAL_KEYCHAINS_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" "${ORIGINAL_KEYCHAINS[@]}"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning \
            | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::The signing archive does not contain a Developer ID Application identity."
            exit 1
          fi
          echo "::add-mask::$SIGNING_IDENTITY"
          {
            echo "CAPPY_CODESIGN_IDENTITY=$SIGNING_IDENTITY"
            echo "CAPPY_CODESIGN_KEYCHAIN=$KEYCHAIN_FILE"
            echo "CAPPY_SIGNING_KEYCHAIN=$KEYCHAIN_FILE"
            echo "CAPPY_ORIGINAL_KEYCHAINS_FILE=$ORIGINAL_KEYCHAINS_FILE"
            echo "APPLE_NOTARY_PRIVATE_KEY_PATH=$NOTARY_KEY_FILE"
          } >> "$GITHUB_ENV"

      - name: Build signed Apple-silicon disk image
        env:
          CAPPY_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CAPPY_ENABLE_SOFTWARE_UPDATES: "1"
        run: ./scripts/package-release.sh

      - name: Notarize and staple app and disk image
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/notarize-release.sh

      - name: Generate signed update feed
        env:
          CAPPY_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./scripts/generate-appcast.sh \
            "dist/Cappy-$VERSION-macos-arm64.dmg" \
            "$RELEASE_TAG"

      - name: Remove temporary credentials
        if: always()
        run: |
          if [[ -f "${CAPPY_ORIGINAL_KEYCHAINS_FILE:-}" ]]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r keychain; do
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              ORIGINAL_KEYCHAINS+=("$keychain")
            done < "$CAPPY_ORIGINAL_KEYCHAINS_FILE"
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" || true
          fi
          if [[ -n "${CAPPY_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CAPPY_SIGNING_KEYCHAIN" || true
          fi
          rm -f -- \
            "$RUNNER_TEMP/cappy-release-signing.p12" \
            "$RUNNER_TEMP/cappy-release-notary.p8" \
            "$RUNNER_TEMP/cappy-original-keychains.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TITLE="Cappy ${RELEASE_TAG#v}"
          RELEASE_NOTES="For Apple silicon on macOS 14 or newer. This build is signed with Developer ID and notarized by Apple. Open the disk image and drag Cappy to Applications."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: homebrew-tap
          fetch-depth: 0
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew cask
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="dist/Cappy-$VERSION-macos-arm64.dmg"
          ARCHIVE_SHA256="$(shasum -a 256 "$ARCHIVE" | cut -d ' ' -f 1)"
          ./scripts/update-homebrew-cask.sh \
            "$GITHUB_WORKSPACE/homebrew-tap/Casks/cappy.rb" \
            "$VERSION" \
            "$ARCHIVE_SHA256"

          cd "$GITHUB_WORKSPACE/homebrew-tap"
          if git diff --quiet -- Casks/cappy.rb; then
            echo "Homebrew cask already matches Cappy $VERSION."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cappy.rb
          git commit -m "Update Cappy to $VERSION"
          git push origin HEAD:main
