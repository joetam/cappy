name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swift format lint --recursive --parallel Sources Package.swift
      - name: Build and test
        run: make test
      - name: Package app
        run: make app
